benchmark_id: task8_offline_procurement
display_name: Task 8 Offline Procurement Benchmark Pack
description: Synthetic offline procurement workflow package for research and portfolio reporting.
domain: procurement
cases:
  - PROCUREMENT_SAMPLE
experiments:
  - experiment_id: task8_procurement_mock_experiment
    cases: data/cases/procurement_decision_cases_sample.csv
    methods:
      - configs/experiments/mock_baseline.yaml
    seeds: [1]
    max_cases: 2
workflows:
  - workflow_run_id: task8_procurement_workflow
    run_id: task8_procurement_workflow
    case_id: PROCUREMENT_SAMPLE
    method_id: mock_reliability_workflow_procurement
    domain: procurement
    decision_date: "2024-01-10"
    task_type: procurement
    manifest: data/raw/rag_samples/documents_manifest.csv
    index_dir: data/indexes/task8_procurement
    rag_config: configs/rag/default_rag.yaml
    claims: data/ledger_samples/mock_procurement_agent_claims.jsonl
    ledger_dir: results/ledgers/task8_procurement_workflow
    guardrail_config: configs/guardrails/default_guardrails.yaml
    policy_paths:
      - configs/policies/default_policy.yaml
      - configs/policies/procurement_policy.yaml
    workflow_config: configs/workflows/procurement_reliability_workflow.yaml
    output_dir: results/workflows/task8_procurement_workflow
    top_k: 2
    max_retries: 1
    expected_artifacts:
      - workflow_state
      - routing_decision
      - reliability_report
      - ledger_summary
      - final_report
method_components:
  - method_id: mock_reliability_workflow_procurement
    domain_enabled: true
    rag_enabled: true
    ledger_enabled: true
    guardrails_enabled: true
    workflow_enabled: true
    notes:
      - Offline procurement sample with local RAG, ledger, guardrails, and workflow routing.
expected_artifacts:
  - workflow_state
  - routing_decision
  - reliability_report
  - ledger_summary
