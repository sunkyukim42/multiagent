experiment_id: live_snapshot_collection_default
provider_limits_path: configs/live_experiments/provider_limits.yaml
default_lookback_days: 90
default_future_horizon_days: 252
providers:
  - fred
  - alphavantage
  - finnhub
  - thenewsapi
benchmark_tickers:
  - SPY
alphavantage_price_function: TIME_SERIES_DAILY
alphavantage_outputsize: compact
alphavantage_adjusted_prices: false
endpoints_by_provider:
  fred:
    - macro_series
  alphavantage:
    - price_history
    - company_profile
  finnhub:
    - company_profile
    - price_history
  thenewsapi:
    - news
macro_series:
  - FEDFUNDS
  - UNRATE
  - CPIAUCSL
  - GDP
  - DCOILWTICO
news_query_templates:
  - "{ticker} {domain}"
max_articles_per_request: 10
use_cache: true
fail_on_missing_required_provider: false
allow_post_decision_label_data: true
notes:
  - Default commands build plans and dry runs without external API calls.
  - Use --allow-live-api only for explicit snapshot collection.
  - Post-decision data is label-only and not usable for agent input.
  - Benchmark tickers support cache-only benchmark-adjusted outcome labels.
  - Alpha Vantage free-key price requests default to TIME_SERIES_DAILY with compact output.
  - TIME_SERIES_DAILY_ADJUSTED may require premium Alpha Vantage access.
