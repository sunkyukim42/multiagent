  - method_id: domain_on_proposed
    display_name: Domain-On Proposed Variant
    role: proposed_variant
    domain_enabled: true
    rag_enabled: false
    ledger_enabled: false
    guardrails_enabled: false
    workflow_enabled: false
    include_snapshot_summary: true
    include_domain_context: true
    include_evidence_context: false
    include_reliability_context: false
