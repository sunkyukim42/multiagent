    - Both methods are local controlled prompt/input variants.
    - Neither method executes official TauricResearch/TradingAgents.
    - The only intended controlled difference is domain-specific oil context.
    - Official upstream comparison remains external and caveated.
    - Task 18B makes no performance claim.
